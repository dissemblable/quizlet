# nginx du conteneur quizlet-web : sert le build statique du front (SPA).
# Il n'est joignable que par le nginx du stack SSO, sur le réseau Docker `web` ;
# l'authentification (auth_request vers Authelia) et le TLS sont gérés en amont.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # En-têtes de sécurité, au niveau server uniquement : un add_header dans une location
    # annulerait leur héritage. Le cache se règle donc avec `expires`, pas avec add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers produits par Vite, nommés avec leur empreinte : cache long.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Toute autre adresse renvoie l'application (routage côté client), sans cache.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
